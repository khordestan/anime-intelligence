name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: anime
          POSTGRES_PASSWORD: anime_test_password
          POSTGRES_DB: anime_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anime -d anime_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations
        env:
          PGPASSWORD: anime_test_password
        run: |
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000001_initial_schema.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000002_catalog_seed.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000003_feature_taxonomy.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000004_auth_sessions.up.sql
      - name: Assert seeded data
        env:
          PGPASSWORD: anime_test_password
        run: |
          test "$(psql -h localhost -U anime -d anime_intelligence -Atc 'SELECT count(*) FROM anime')" = "8"
          test "$(psql -h localhost -U anime -d anime_intelligence -Atc 'SELECT count(*) FROM anime_features')" = "40"
          test "$(psql -h localhost -U anime -d anime_intelligence -Atc \"SELECT count(*) FROM information_schema.tables WHERE table_name = 'auth_sessions'\")" = "1"
          test "$(psql -h localhost -U anime -d anime_intelligence -Atc \"SELECT count(*) FROM information_schema.columns WHERE table_name = 'users' AND column_name = 'password_hash'\")" = "1"
      - name: Verify authentication constraints
        env:
          PGPASSWORD: anime_test_password
        run: |
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -c "INSERT INTO users (email) VALUES ('Auth-Constraint-Test@example.com')"
          if psql -h localhost -U anime -d anime_intelligence -c "INSERT INTO users (email) VALUES ('auth-constraint-test@example.com')" >/dev/null 2>&1; then
            echo "Case-insensitive duplicate email was accepted"
            exit 1
          fi
          if psql -h localhost -U anime -d anime_intelligence -c "INSERT INTO auth_sessions (user_id, token_hash, expires_at) SELECT id, decode('00','hex'), now() + interval '1 hour' FROM users WHERE email = 'Auth-Constraint-Test@example.com'" >/dev/null 2>&1; then
            echo "Invalid session token hash length was accepted"
            exit 1
          fi
      - name: Verify rollback order
        env:
          PGPASSWORD: anime_test_password
        run: |
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000004_auth_sessions.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000003_feature_taxonomy.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000002_catalog_seed.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000001_initial_schema.down.sql
