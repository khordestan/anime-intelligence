name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: web/test-results
          retention-days: 3
  full-stack-browser:
    strategy:
      fail-fast: false
      matrix:
        suite: [postgres, identity]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_REAL_API: "1"
      E2E_SUITE: ${{ matrix.suite }}
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080/api/v1
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: anime
          POSTGRES_PASSWORD: anime_test_password
          POSTGRES_DB: anime_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anime -d anime_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Provision the disposable database and restricted runtime role
        env:
          MIGRATION_DATABASE_URL: postgres://anime:anime_test_password@127.0.0.1:5432/anime_intelligence?sslmode=disable
          PGPASSWORD: anime_test_password
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          go run ./cmd/migrate
          psql -h 127.0.0.1 -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f deployments/runtime-role.sql
          runtime_password=$(openssl rand -hex 32)
          echo "::add-mask::$runtime_password"
          psql -h 127.0.0.1 -U anime -d anime_intelligence -v ON_ERROR_STOP=1 <<SQL
          ALTER ROLE anime_runtime PASSWORD '$runtime_password';
          SQL
          echo "DATABASE_URL=postgres://anime_runtime:$runtime_password@127.0.0.1:5432/anime_intelligence?sslmode=disable" >> "$GITHUB_ENV"
      - name: Configure loopback-only synthetic TLS mail
        run: |
          outbox_key=$(openssl rand -base64 32)
          previous_outbox_key=$(openssl rand -base64 32)
          echo "::add-mask::$outbox_key"
          echo "::add-mask::$previous_outbox_key"
          smtp_password=$(openssl rand -hex 32)
          mailbox_key=$(openssl rand -hex 32)
          echo "::add-mask::$smtp_password"
          echo "::add-mask::$mailbox_key"
          {
            echo "MAIL_OUTBOX_KEY=$outbox_key"
            echo "MAIL_OUTBOX_PREVIOUS_KEYS=$previous_outbox_key"
            echo "IDENTITY_MAIL_TEST=1"
            echo "MAIL_SMTP_ADDR=127.0.0.1:8465"
            echo "MAIL_SMTP_USER=synthetic-mailer"
            echo "MAIL_SMTP_PASSWORD=$smtp_password"
            echo "MAIL_FROM=sender@example.test"
            echo "PUBLIC_APP_ORIGIN=http://127.0.0.1:3000"
            echo "MAIL_SMTP_CA_FILE=$RUNNER_TEMP/identity-mail-ca.pem"
            echo "MAIL_TEST_ACCESS_KEY=$mailbox_key"
          } >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser tests against the Go API and PostgreSQL
        run: npm run test:e2e
        working-directory: web
      - name: Verify atomic diagnostic export through the restricted database role
        run: |
          go run ./cmd/identity-status -format=prometheus -output-file="$RUNNER_TEMP/anime_identity.prom"
          test -s "$RUNNER_TEMP/anime_identity.prom"
          test "$(stat -c '%a' "$RUNNER_TEMP/anime_identity.prom")" = "640"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-stack-browser-results-${{ matrix.suite }}
          path: web/test-results
          retention-days: 3
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: anime
          POSTGRES_PASSWORD: anime_test_password
          POSTGRES_DB: anime_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anime -d anime_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: PostgreSQL runtime, authentication, isolation and migration tests
        env:
          TEST_DATABASE_URL: postgres://anime:anime_test_password@localhost:5432/anime_intelligence?sslmode=disable
        run: go test -race -count=1 -timeout=3m -v ./internal/platform/postgres
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations
        env:
          PGPASSWORD: anime_test_password
        run: |
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000001_initial_schema.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000002_catalog_seed.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000003_feature_taxonomy.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000004_auth_sessions.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000005_row_level_security.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000006_identity_challenges.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000007_login_attempt_budget.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000008_identity_outbox.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000009_identity_requests.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000010_identity_queue_outcomes.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000011_catalog_sync.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000012_release_alerts.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000013_exact_episode_progress.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000014_catalog_fetch_state.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000015_watch_cycles.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000016_catalog_fetch_jobs.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000017_tvmaze_fetch_jobs.up.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000018_catalog_schedule_scope.up.sql
      - name: Assert seeded data
        env:
          PGPASSWORD: anime_test_password
        run: |
          test "$(psql -h localhost -U anime -d anime_intelligence -Atc 'SELECT count(*) FROM anime')" = "8"
          test "$(psql -h localhost -U anime -d anime_intelligence -Atc 'SELECT count(*) FROM anime_features')" = "40"
          test "$(psql -h localhost -U anime -d anime_intelligence -Atc "SELECT count(*) FROM information_schema.tables WHERE table_name = 'auth_sessions'")" = "1"
          test "$(psql -h localhost -U anime -d anime_intelligence -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name = 'users' AND column_name = 'password_hash'")" = "1"
      - name: Verify row-level security
        env:
          PGPASSWORD: anime_test_password
        run: |
          test "$(psql -h localhost -U anime -d anime_intelligence -Atc "SELECT count(*) FROM pg_class WHERE relname IN ('users','auth_sessions','user_anime','user_ratings','watch_progress','user_preferences','recommendations','recommendation_feedback','user_follows','notifications','auth_challenges','identity_outbox','identity_requests','watch_cycles') AND relrowsecurity AND relforcerowsecurity")" = "14"
          test "$(psql -h localhost -U anime -d anime_intelligence -Atc "SELECT count(*) FROM pg_policies WHERE policyname LIKE '%_self_access'")" = "13"
          test "$(psql -h localhost -U anime -d anime_intelligence -Atc "SELECT count(*) FROM pg_policies WHERE policyname IN ('users_login_lookup','auth_sessions_token_lookup')")" = "2"
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 <<'SQL'
          DO $body$ BEGIN
            CREATE ROLE anime_app NOLOGIN;
          EXCEPTION WHEN duplicate_object THEN NULL;
          END $body$;
          GRANT SELECT ON users, auth_sessions TO anime_app;
          INSERT INTO users (id, email) VALUES
            ('20000000-0000-4000-8000-000000000001', 'rls-one@example.test'),
            ('20000000-0000-4000-8000-000000000002', 'rls-two@example.test');
          INSERT INTO auth_sessions (user_id, token_hash, expires_at) VALUES
            ('20000000-0000-4000-8000-000000000001', decode(repeat('ab', 32), 'hex'), now() + interval '1 hour');
          SET ROLE anime_app;
          SET app.login_email = 'rls-one@example.test';
          DO $body$ DECLARE visible_users integer; BEGIN
            SELECT count(*) INTO visible_users FROM users;
            IF visible_users <> 1 THEN
              RAISE EXCEPTION 'Login RLS expected one visible user, got %', visible_users;
            END IF;
          END $body$;
          SET app.session_token_hash = 'abababababababababababababababababababababababababababababababab';
          DO $body$ DECLARE visible_sessions integer; BEGIN
            SELECT count(*) INTO visible_sessions FROM auth_sessions;
            IF visible_sessions <> 1 THEN
              RAISE EXCEPTION 'Session RLS expected one visible session, got %', visible_sessions;
            END IF;
          END $body$;
          SET app.login_email = '';
          SET app.session_token_hash = '';
          SET app.user_id = '20000000-0000-4000-8000-000000000001';
          DO $body$ DECLARE visible_users integer; BEGIN
            SELECT count(*) INTO visible_users FROM users;
            IF visible_users <> 1 THEN
              RAISE EXCEPTION 'RLS expected one visible user, got %', visible_users;
            END IF;
          END $body$;
          RESET ROLE;
          DELETE FROM users WHERE id IN (
            '20000000-0000-4000-8000-000000000001',
            '20000000-0000-4000-8000-000000000002'
          );
          SQL
      - name: Verify authentication constraints
        env:
          PGPASSWORD: anime_test_password
        run: |
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -c "INSERT INTO users (email) VALUES ('Auth-Constraint-Test@example.com')"
          if psql -h localhost -U anime -d anime_intelligence -c "INSERT INTO users (email) VALUES ('auth-constraint-test@example.com')" >/dev/null 2>&1; then
            echo "Case-insensitive duplicate email was accepted"
            exit 1
          fi
          if psql -h localhost -U anime -d anime_intelligence -c "INSERT INTO auth_sessions (user_id, token_hash, expires_at) SELECT id, decode('00','hex'), now() + interval '1 hour' FROM users WHERE email = 'Auth-Constraint-Test@example.com'" >/dev/null 2>&1; then
            echo "Invalid session token hash length was accepted"
            exit 1
          fi
      - name: Verify rollback order
        env:
          PGPASSWORD: anime_test_password
        run: |
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000018_catalog_schedule_scope.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000017_tvmaze_fetch_jobs.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000016_catalog_fetch_jobs.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000015_watch_cycles.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000014_catalog_fetch_state.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000013_exact_episode_progress.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000012_release_alerts.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000011_catalog_sync.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000010_identity_queue_outcomes.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000009_identity_requests.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000008_identity_outbox.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000007_login_attempt_budget.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000006_identity_challenges.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000005_row_level_security.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000004_auth_sessions.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000003_feature_taxonomy.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000002_catalog_seed.down.sql
          psql -h localhost -U anime -d anime_intelligence -v ON_ERROR_STOP=1 -f migrations/000001_initial_schema.down.sql

  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Match pg_dump/pg_restore to the server without relying on runner clients.
    container: postgres:17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: anime
          POSTGRES_PASSWORD: anime_test_password
          POSTGRES_DB: anime_recovery_admin
        options: >-
          --health-cmd "pg_isready -U anime -d anime_recovery_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Install compiler for race checks
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev git ca-certificates
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Exercise isolated logical restore, RLS, key recovery and offline fencing
        env:
          TEST_DATABASE_URL: postgres://anime:anime_test_password@postgres:5432/anime_recovery_admin?sslmode=disable
          TEST_POSTGRES_RECOVERY: "1"
        run: go test -race -count=1 -timeout=3m -v -run '^TestBackupRestoreRecovery$' ./internal/platform/postgres

  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install checksum-pinned Prometheus LTS test tooling
        run: scripts/install-promtool.sh "$RUNNER_TEMP/anime-promtool"
      - name: Validate monitoring configuration and alert behavior
        run: |
          "$RUNNER_TEMP/anime-promtool/promtool" check config deployments/monitoring/prometheus.example.yml
          "$RUNNER_TEMP/anime-promtool/promtool" check rules deployments/monitoring/identity-alerts.yml
          "$RUNNER_TEMP/anime-promtool/promtool" check rules deployments/monitoring/catalog-alerts.yml
          "$RUNNER_TEMP/anime-promtool/promtool" test rules deployments/monitoring/identity-alerts.test.yml
          "$RUNNER_TEMP/anime-promtool/promtool" test rules deployments/monitoring/catalog-alerts.test.yml
      - name: Validate inactive systemd example syntax
        run: scripts/check-monitoring-units.sh
      - name: Validate actual exporter output with Prometheus parser
        run: |
          set -o pipefail
          go run ./scripts/render-monitoring-fixture.go | "$RUNNER_TEMP/anime-promtool/promtool" check metrics
          go run ./scripts/render-catalog-monitoring-fixture.go | "$RUNNER_TEMP/anime-promtool/promtool" check metrics
