openapi: 3.1.0
info:
  title: Anime Intelligence API
  version: 1.0.0
  description: Development API. PostgreSQL mode supports bearer sessions and user-scoped tracking; JSON mode is unauthenticated and single-user. Neither mode is ready for public deployment.
servers:
  - url: http://localhost:8080
paths:
  /api/v1:
    get:
      summary: Runtime metadata for capability detection
      responses:
        "200":
          description: API identity and whether this runtime requires bearer authentication for private resources
          content:
            application/json:
              schema:
                type: object
                required: [name, version, status, authenticationRequired]
                properties:
                  name: { type: string }
                  version: { type: string }
                  status: { type: string }
                  authenticationRequired: { type: boolean }
                  emailVerificationRequired: { type: boolean, description: True in PostgreSQL mode. Tracker and rating operations require emailVerified in addition to a valid session. }
                  identityDeliveryAvailable: { type: boolean, description: True only when the PostgreSQL runtime has explicit identity delivery configuration. }
  /healthz:
    get:
      summary: Process liveness independent of database readiness
      responses:
        "200":
          description: API process is responding; dependency readiness is checked separately
  /readyz:
    get:
      summary: Runtime readiness
      description: Uncached dependency probe with a two-second deadline. PostgreSQL mode rechecks its restricted role and minimum required security schema. Busy or unavailable probes return a generic 503; liveness stays separate. Local mode has no external dependency. This is not approval for public deployment.
      security: []
      responses:
        "200":
          description: Runtime dependencies and minimum schema checks succeeded
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
        "503":
          description: Database, role, schema or probe capacity is unavailable; internal details are not disclosed
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
  /api/v1/anime:
    get:
      summary: Search catalog
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Catalog page
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, count]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Anime' }
                  limit: { type: integer }
                  offset: { type: integer }
                  count: { type: integer }
  /api/v1/anime/lookup:
    get:
      summary: Resolve an exact public provider identity
      description: Case-sensitive provider and externalId lookup, with no title matching, private account data, network fetch or authority transfer.
      parameters:
        - in: query
          name: provider
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$' }
        - in: query
          name: externalId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$' }
      responses:
        "200":
          description: Canonical public title
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anime' }
        "400": { description: Missing, duplicated or invalid identity }
        "404": { description: Unknown exact identity }
  /api/v1/anime/{id}:
    get:
      summary: Get anime by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Anime details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anime' }
        "404": { description: Anime not found }
  /api/v1/anime/{id}/details:
    get:
      summary: Public catalog enrichment, continuity relations and current episode schedules
      description: Returns explicit source/time provenance when imported. Schedules are predictions; only releasedAt confirms availability. Synopsis and tags may contain spoilers. Relations include canonical linked title, media type and status. PREQUEL/SEQUEL links are navigable from either end with duplicate reciprocal assertions suppressed; other types remain directed. No private tracking data is included.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Consistent public catalog snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogDetails' }
        "400": { description: Invalid UUID }
        "404": { description: Anime not found }
  /api/v1/tracker/{id}/notes:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read private tracker notes
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Plain-text notes and updatedAt save condition; uncached }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing or foreign tracker entry }
    put:
      summary: Conditionally replace private tracker notes
      description: Up to 2000 Unicode code points. Empty notes clear the value. expectedUpdatedAt must match the current tracker timestamp; concurrent tracker changes require a reload. Saved notes remain across rewatches and are included in export/deletion.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [notes, expectedUpdatedAt]
              properties:
                notes: { type: string, maxLength: 2000 }
                expectedUpdatedAt: { type: string, format: date-time }
      responses:
        "200": { description: Saved notes and new updatedAt condition }
        "400": { description: Invalid notes or timestamp }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing or foreign tracker entry }
        "409": { description: Tracker changed; saved notes remain unchanged }
  /api/v1/tracker/{id}/rewatches:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read owned completed viewing passes
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: before
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200": { description: currentCycle and up to 100 snapshots with cycle/count/total/numbers/mode/rating/archivedAt plus nextBefore (zero at end) }
        "400": { description: Invalid history boundary }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Tracker not found for caller }
    post:
      summary: Archive a completed pass and explicitly start a rewatch
      description: Atomically archives current count or exact progress and rating then resets progress to count zero/WATCHING. Series rating and follows remain. Expected cycle prevents a retry from resetting another pass. JSON demo mode is unsupported.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedCycle]
              properties:
                expectedCycle: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200": { description: Updated tracker entry including watchCycle }
        "400": { description: Invalid request }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Tracker not found for caller }
        "409": { description: Expected cycle changed, current pass is incomplete or limit reached }
  /api/v1/tracker/{id}/episodes:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read owned exact or aggregate episode progress
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Progress with animeId, watchCycle, COUNT/EXACT mode, count, nullable numbers and nullable total }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing or foreign tracker entry }
    put:
      summary: Replace owned progress with an exact episode-number set
      description: Explicitly replaces the aggregate count. Empty arrays clear progress. Duplicates and episodes beyond a known total are rejected.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [numbers]
              properties:
                expectedCycle: { type: integer, minimum: 1, maximum: 1000, description: Optional pass guard; stale values return 409. }
                numbers:
                  type: array
                  maxItems: 10000
                  uniqueItems: true
                  items: { type: integer, minimum: 1, maximum: 100000 }
      responses:
        "200": { description: Saved ordered exact progress }
        "409": { description: Viewing pass changed; no progress was overwritten }
        "400": { description: Invalid body or episode selection }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing or foreign tracker entry }
  /api/v1/follows:
    get:
      summary: List owned anime release subscriptions
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Up to 1000 owned subscriptions with track and creation time }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/follows/{id}:
    put:
      summary: Follow a season or its linked franchise and choose a release track
      description: Retains the original subscription time on updates and replaces the previous scope for this title. FRANCHISE follows traverse prequel/sequel links and include new-season announcements. Does not replay events before a new subscription.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                track: { type: string, enum: [RAW, SUB, DUB, UNKNOWN, ALL], default: SUB }
                scope: { type: string, enum: [ANIME, FRANCHISE], default: ANIME }
      responses:
        "204": { description: Owned subscription saved }
        "409": { description: Account already follows 1000 titles; existing preferences can still change }
        "400": { description: Invalid identifier, track or body }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Unknown anime }
    delete:
      summary: Remove an owned season or franchise subscription
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: scope
          schema: { type: string, enum: [ANIME, FRANCHISE], default: ANIME }
      responses:
        "204": { description: Subscription removed; existing notices retained }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing subscription }
  /api/v1/calendar:
    get:
      summary: Read unconfirmed schedules for the verified owner's follows
      description: Applies direct/franchise season scope and track preferences. Latest revision wins before date filtering; confirmed releases are excluded. Predictions do not establish availability. Results cap at 100 and truncated indicates a narrower window is needed.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: from
          description: UTC start date, inclusive; defaults to today.
          schema: { type: string, format: date }
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 31, default: 14 }
      responses:
        "200": { description: from/to window (end exclusive), items with animeId/title/number/track/scheduledAt/revision and optional provider/verifiedAt, limit and truncated }
        "400": { description: Invalid UTC date/window }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/notifications:
    get:
      summary: Poll owned in-app release notifications
      description: Without a cursor, materializes at most 100 eligible unique notices and returns the newest 100 owned in-app notices. A cursor reads the next already-materialized history page without generating notices. Every page rechecks the verified owner; time/UUID cursor boundaries never select an account. No background delivery or email/push is enabled.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: cursor
          description: Opaque nextCursor from a previous page; empty selects the latest page.
          schema: { type: string, maxLength: 256 }
      responses:
        "200": { description: Owned items with id/title/body/createdAt/optional readAt, count, limit=100 and nextCursor (empty at end) }
        "400": { description: Invalid notification cursor }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/notifications/{id}/read:
    patch:
      summary: Idempotently mark an owned notification read
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Notice is read }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing or foreign notice }
  /api/v1/preferences:
    get:
      summary: List safe feature taxonomy and the caller's declared weights
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Up to 256 active non-spoiler features with key, name, category and nullable weight }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/preferences/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema: { type: string, maxLength: 128 }
    put:
      summary: Set an owned declared feature preference
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [weight]
              properties:
                weight: { type: number, minimum: -1, maximum: 1 }
      responses:
        "204": { description: Preference saved with declared confidence one }
        "400": { description: Invalid weight, body or unknown fields }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing, inactive or spoiler-sensitive feature }
    delete:
      summary: Reset an owned declared preference without deleting rating-derived signals
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Declared preference reset idempotently }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing, inactive or spoiler-sensitive feature }
  /api/v1/recommendations:
    get:
      summary: Evidence-backed Personal Match ranking for the verified owner
      description: Uses declared preferences and up to 1000 own series ratings against at most 500 title-ordered untracked candidates. Only referenced curated non-spoiler series observations qualify. Empty evidence produces an empty list. A key-ordered profile of at most 256 active non-spoiler features separates declared and own-rating-derived weight/confidence signals. Raw references, rated-title lists and private record identifiers are not returned. Scores are algorithmic compatibility scores, not probabilities.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { description: Items with animeId, title, score, algorithmVersion and up to four feature-key evidence records; response includes candidate/rating caps and bounded declared/inferred profile signals }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/tracker:
    get:
      security: [{ bearerAuth: [] }]
      summary: List library entries
      responses:
        "200": { description: User library }
        "401": { description: Missing or invalid session in PostgreSQL mode }
        "403": { description: email_verification_required in PostgreSQL mode; account controls remain accessible }
    post:
      security: [{ bearerAuth: [] }]
      summary: Add anime to library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [animeId, watchStatus, episodesWatched]
              properties:
                animeId: { type: string, format: uuid }
                watchStatus: { type: string, enum: [PLANNING, WATCHING, COMPLETED, ON_HOLD, DROPPED] }
                episodesWatched: { type: integer, minimum: 0 }
      responses:
        "201": { description: Library entry created }
        "401": { description: Missing or invalid session in PostgreSQL mode }
        "403": { description: email_verification_required in PostgreSQL mode; account controls remain accessible }
  /api/v1/tracker/{id}:
    delete:
      security: [{ bearerAuth: [] }]
      summary: Remove an owned library entry
      description: Atomically deletes this title's tracker entry, all ratings and progress for the caller. Other accounts, shared catalog, follows and recommendation history remain unchanged. Re-adding starts without the deleted rating/progress. JSON mode is local and unauthenticated.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Entry and associated ratings/progress removed; empty response }
        "400": { description: Malformed tracker ID }
        "401": { description: Missing or invalid session in PostgreSQL mode }
        "403": { description: Email verification required in PostgreSQL mode }
        "404": { description: Unknown, foreign or already removed entry }
        "500": { description: Removal failed; transaction rolled back }
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update tracking progress or status
      description: Optional expectedCycle enables a PostgreSQL pass guard; stale edits return 409. Omission keeps legacy unconditional behavior.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedCycle: { type: integer, minimum: 1, maximum: 1000 }
                watchStatus: { type: string, enum: [PLANNING, WATCHING, COMPLETED, ON_HOLD, DROPPED] }
                episodesWatched: { type: integer, minimum: 0 }
      responses:
        "200": { description: Updated entry }
        "409": { description: Viewing pass changed; no update applied }
        "401": { description: Missing or invalid session in PostgreSQL mode }
        "403": { description: email_verification_required in PostgreSQL mode; account controls remain accessible }
  /api/v1/ratings/{id}:
    put:
      security: [{ bearerAuth: [] }]
      summary: Set rating for a library anime
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "200": { description: Rating saved }
        "401": { description: Missing or invalid session in PostgreSQL mode }
        "403": { description: email_verification_required in PostgreSQL mode; account controls remain accessible }
  /api/v1/auth/register:
    post:
      summary: Register an account (PostgreSQL mode only)
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        "201":
          description: New account and session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        "400": { description: Invalid email, password, or JSON }
        "409": { description: Account unavailable }
        "429": { description: Authentication rate or concurrency limit reached }
  /api/v1/auth/login:
    post:
      summary: Verify credentials (PostgreSQL mode only)
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        "401": { description: Generic invalid credentials response, including disabled or temporarily locked accounts; no lock state is disclosed }
        "429": { description: Authentication rate or concurrency limit reached }
  /api/v1/auth/me:
    get:
      summary: Get the current verified account
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "401": { description: Missing or invalid session }
  /api/v1/auth/refresh:
    post:
      summary: Atomically revoke and replace the current session token
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Replacement session; the old token is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        "401": { description: Missing or invalid session }
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session revoked }
        "401": { description: Missing or invalid session }
  /api/v1/auth/export:
    get:
      summary: Download the current account's product data
      description: Consistent versioned JSON snapshot. Excludes credential/session hashes and security metadata. No-store response with an attachment filename.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account data export
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, exportedAt, user, data]
                properties:
                  schemaVersion: { type: integer, const: 1 }
                  exportedAt: { type: string, format: date-time }
                  user: { $ref: '#/components/schemas/User' }
                  data:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: object }
        "401": { description: Missing or invalid session }
  /api/v1/auth/account:
    delete:
      summary: Permanently delete the current account and its data
      description: Requires the current password. Revokes all account sessions by deleting them. Does not accept a target user ID. This operation cannot be undone.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        "204": { description: Account and owned records deleted }
        "400": { description: Invalid JSON or unknown fields }
        "401": { description: Missing/invalid session, or invalid_current_password for incorrect reauthentication }
        "429": { description: Authentication rate or concurrency limit reached }
  /api/v1/auth/sessions:
    get:
      summary: List the current account's active sessions
      description: Current session first, then newest sessions, bounded to 100. Excludes expired/revoked sessions and all token/digest fields. No-store response.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Owned active sessions
          content:
            application/json:
              schema:
                type: object
                required: [items, count, hasMore]
                properties:
                  count: { type: integer, minimum: 0, maximum: 100 }
                  hasMore: { type: boolean }
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/SessionInfo' }
        "401": { description: Missing or invalid session }
  /api/v1/auth/sessions/{id}:
    delete:
      summary: Revoke an owned active session
      description: A stable ID remains revocable after token refresh. Revoking the current ID signs out the caller.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Session revoked }
        "400": { description: Malformed session ID }
        "401": { description: Missing or invalid caller session }
        "404": { description: Unknown, foreign, expired, or already-revoked session }
  /api/v1/auth/sessions/revoke-others:
    post:
      summary: Sign out all other active sessions
      description: Includes sessions omitted by the bounded listing. Retains the caller session and is idempotent.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, minimum: 0 }
        "401": { description: Missing or invalid session }
  /api/v1/auth/password:
    post:
      summary: Change the current account's password and sign out all existing sessions
      description: Requires current-password verification. New passwords use the registration Argon2id policy. The hash update and revocation commit atomically; the caller must sign in again. Invalid current passwords leave the account and sessions unchanged.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, description: Must contain 12–1024 UTF-8 bytes. }
      responses:
        "204": { description: Password changed and all existing account sessions revoked }
        "400": { description: Invalid JSON, unknown fields, or invalid replacement password }
        "401": { description: Missing/invalid session, or invalid_current_password for incorrect reauthentication }
        "429": { description: Authentication rate or concurrency limit reached }
  /api/v1/auth/password-reset/request:
    post:
      summary: Request an out-of-band password reset
      description: Durable, generic acceptance for known/unknown accounts; an encrypted intent commits before 202, with account lookup deferred. No token is returned. Delivery must be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "202": { description: Encrypted request intent committed for processing within fifteen minutes; account existence and delivery result are not disclosed }
        "400": { description: Invalid JSON or oversized email }
        "429": { description: Request rate/concurrency limit reached }
        "503": { description: Identity delivery is disabled or queue unavailable }
  /api/v1/auth/password-reset/confirm:
    post:
      summary: Consume a reset token and replace the password
      description: Revokes all existing sessions and pending identity challenges. Does not issue a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
                newPassword: { type: string, format: password }
      responses:
        "204": { description: Password reset; sign in again }
        "400": { description: Invalid/expired/replayed/wrong-purpose token, JSON, or replacement password }
        "429": { description: Authentication rate/concurrency limit reached }
  /api/v1/auth/email-verification/request:
    post:
      summary: Request verification of the current account's stored email
      description: Optional body must be empty or an empty JSON object. Recipient overrides are rejected.
      security: [{ bearerAuth: [] }]
      responses:
        "202": { description: Encrypted request intent committed; session is rechecked before issuance and already-verified/cooldown cases send no new mail }
        "400": { description: Unexpected fields or invalid JSON }
        "401": { description: Missing or invalid session }
        "429": { description: Request rate/concurrency limit reached }
        "503": { description: Identity delivery is disabled or queue unavailable }
  /api/v1/auth/email-verification/confirm:
    post:
      summary: Consume an email-verification token
      description: Does not reset passwords or automatically authenticate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "204": { description: Email verified }
        "400": { description: Invalid/expired/replayed/wrong-purpose token or JSON }
        "429": { description: Request rate/concurrency limit reached }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token; PostgreSQL mode only. Never send tokens in URLs.
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
              email: { type: string, format: email, maxLength: 254 }
              password:
                type: string
                format: password
                description: Registration requires 12–1024 UTF-8 bytes. Request body limit is 4096 bytes.
  schemas:
    CatalogDetails:
      type: object
      required: [anime, externalIds, synonyms, genres, themes, demographics, tags, studios, relations, episodes]
      properties:
        anime: { $ref: '#/components/schemas/Anime' }
        externalIds:
          type: array
          description: Exact public title identities, not metadata authority or raw review evidence.
          items:
            type: object
            required: [provider, externalId]
            properties:
              provider: { type: string }
              externalId: { type: string }
        provider: { type: string }
        observedAt: { type: string, format: date-time }
        synonyms: { type: array, items: { type: string } }
        genres: { type: array, items: { type: string } }
        themes: { type: array, items: { type: string }, description: Sourced themes; may contain spoilers. }
        demographics: { type: array, items: { type: string }, description: Provider title category labels; never inferred user attributes. }
        tags: { type: array, items: { type: string } }
        studios: { type: array, items: { type: string } }
        relations:
          type: array
          items:
            type: object
            required: [animeId, type, title, mediaType, status]
            properties:
              animeId: { type: string, format: uuid }
              type: { type: string }
              title: { type: string }
              mediaType: { type: string }
              status: { type: string }
        episodes:
          type: array
          items:
            type: object
            required: [number, track, revision]
            properties:
              number: { type: integer }
              track: { type: string, enum: [RAW, SUB, DUB, UNKNOWN] }
              revision: { type: integer }
              scheduledAt: { type: string, format: date-time }
              releasedAt: { type: string, format: date-time }
              verifiedAt: { type: string, format: date-time }
    Anime:
      type: object
      required: [id, title, mediaType, status, episodeCountKnown]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        nativeTitle: { type: string }
        mediaType: { type: string }
        status: { type: string }
        releaseYear: { type: integer }
        synopsis: { type: string, description: Optional source text; may contain spoilers. }
        season: { type: string, description: Optional airing quarter rather than franchise season number. }
        coverImageUrl: { type: string }
        episodeCountKnown: { type: boolean, description: False means the episode total is unknown. }
        episodeCount: { type: integer, description: Omitted when zero; use episodeCountKnown to distinguish known zero from unknown. }
    SessionInfo:
      type: object
      additionalProperties: false
      required: [id, createdAt, expiresAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }
    User:
      type: object
      required: [id, email, displayName, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        emailVerified: { type: boolean }
    Session:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string, minLength: 43, maxLength: 43, description: Returned only at issuance; store in volatile client memory. }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
