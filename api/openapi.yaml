openapi: 3.1.0
info:
  title: Anime Intelligence API
  version: 1.0.0
  description: Development API. PostgreSQL mode supports bearer sessions and user-scoped tracking; JSON mode is unauthenticated and single-user. Neither mode is ready for public deployment.
servers:
  - url: http://localhost:8080
paths:
  /api/v1:
    get:
      summary: Runtime metadata for capability detection
      responses:
        "200":
          description: API identity and whether this runtime requires bearer authentication for private resources
          content:
            application/json:
              schema:
                type: object
                required: [name, version, status, authenticationRequired]
                properties:
                  name: { type: string }
                  version: { type: string }
                  status: { type: string }
                  authenticationRequired: { type: boolean }
                  assistedCatalogAnalysisAvailable: { type: boolean, description: Model-assisted catalog topic selection is configured. }
                  globalEssentialsAvailable: { type: boolean, description: A reviewed Essentials manifest is loaded. }
                  emailVerificationRequired: { type: boolean, description: True in PostgreSQL mode. Tracker and rating operations require emailVerified in addition to a valid session. }
                  identityDeliveryAvailable: { type: boolean, description: True only when the PostgreSQL runtime has explicit identity delivery configuration. }
  /healthz:
    get:
      summary: Process liveness independent of database readiness
      responses:
        "200":
          description: API process is responding; dependency readiness is checked separately
  /readyz:
    get:
      summary: Runtime readiness
      description: Uncached dependency probe with a two-second deadline. PostgreSQL mode rechecks its restricted role and minimum required security schema. Busy or unavailable probes return a generic 503; liveness stays separate. Local mode has no external dependency. This is not approval for public deployment.
      security: []
      responses:
        "200":
          description: Runtime dependencies and minimum schema checks succeeded
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
        "503":
          description: Database, role, schema or probe capacity is unavailable; internal details are not disclosed
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
  /api/v1/analysis/catalog:
    post:
      summary: Select sourced catalog facts for one or two canonical titles
      description: Uses a deterministic topic selector. No question is sent to an external service. Eligible fields are format, release year and quarter, episode count, status, native title, genres, studios, demographics, confirmed releases and upcoming unconfirmed schedules. An unrecognized topic returns the eligible fact list with topicMatched false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question, animeIds]
              properties:
                question: { type: string, minLength: 1, maxLength: 400, description: UTF-8 input capped at 400 bytes. }
                animeIds:
                  type: array
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "200": { description: Engine version and topicMatched flag plus title evidence with field, values and available provider and observation time. Episode evidence uses episodeFacts with number, track, time and optional provider. Direct prequel and sequel evidence uses continuityFacts with animeId, title, relation and recorded providers. A fact with no evidence entries is unknown. Long value lists are capped at 20 and marked truncated. Two titles may include comparisons for known numeric fields, with difference equal to the first value minus the second. Optional sharedEvidence lists genre or studio values supported by both returned evidence lists. }
        "400": { description: Invalid question or selection }
        "404": { description: One or more selected anime are missing }
  /api/v1/analysis/catalog/assisted:
    post:
      summary: Use a configured model to select catalog topics for the verified caller
      description: Only the question and public allowed field keys go to the provider. The application generates the response from catalog evidence and reports the model identifier.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question, animeIds]
              properties:
                question: { type: string, minLength: 1, maxLength: 400, description: UTF-8 input capped at 400 bytes. }
                animeIds:
                  type: array
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "200": { description: Sourced catalog evidence, supported numeric comparisons, optional shared genre or studio evidence and model selection provenance }
        "400": { description: Invalid question or selection }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Model assistance unavailable or selected anime not found }
        "429": { description: Request budget exhausted or model work already at capacity }
        "502": { description: Model unavailable or invalid topic selection }
  /api/v1/anime:
    get:
      summary: Search or browse the public catalog
      description: Supply cursor=start for the first cursor page. Keep the same filters and sort when using nextCursor. Cursor and offset are mutually exclusive.
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        - in: query
          name: cursor
          schema: { type: string, minLength: 1, maxLength: 16384 }
        - in: query
          name: sort
          schema: { type: string, enum: [TITLE, NEWEST, OLDEST], default: TITLE }
        - in: query
          name: confirmedRelease
          description: Require a latest episode/track observation with a confirmed release timestamp at or before now. Local starter mode has no release observations.
          schema: { type: boolean, default: false }
        - in: query
          name: confirmedTrack
          description: Require a latest confirmed release on this track at or before the query time.
          schema: { type: string, enum: [RAW, SUB, DUB, UNKNOWN] }
        - in: query
          name: metadataProvider
          description: Exact provider key for the title's primary metadata.
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Catalog page
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, count]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Anime' }
                  limit: { type: integer }
                  offset: { type: integer }
                  count: { type: integer }
                  nextOffset: { type: integer }
                  previousOffset: { type: integer }
                  nextCursor: { type: string }
        "400": { description: Invalid filter or cursor }
  /api/v1/anime/lookup:
    get:
      summary: Resolve an exact public provider identity
      description: Case-sensitive provider and externalId lookup, with no title matching, private account data, network fetch or authority transfer.
      parameters:
        - in: query
          name: provider
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$' }
        - in: query
          name: externalId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$' }
      responses:
        "200":
          description: Canonical public title
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anime' }
        "400": { description: Missing, duplicated or invalid identity }
        "404": { description: Unknown exact identity }
  /api/v1/anime/facets:
    get:
      summary: Suggest stored catalog facet values
      parameters:
        - in: query
          name: field
          required: true
          schema: { type: string, enum: [genres, themes, demographics, studios, providers] }
        - in: query
          name: prefix
          schema: { type: string, maxLength: 128 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { description: Items and hasMore flag. Provider suggestions include keys with retained primary catalog metadata. }
        "400": { description: Invalid facet query }
  /api/v1/anime/{id}:
    get:
      description: A reviewed retired canonical ID resolves to its active survivor in PostgreSQL mode.
      summary: Get anime by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Anime details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anime' }
        "404": { description: Anime not found }
  /api/v1/anime/{id}/episodes/{number}/schedule-history:
    get:
      summary: Read schedule revisions for one episode and release track
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: number
          required: true
          schema: { type: integer, minimum: 1, maximum: 100000 }
        - in: query
          name: track
          required: true
          schema: { type: string, enum: [RAW, SUB, DUB, UNKNOWN] }
        - in: query
          name: beforeRevision
          description: Return strictly older revisions. Pass nextBeforeRevision from the previous response.
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { description: Up to 20 schedule revisions newest first with their source and independent scheduledAt and releasedAt facts. Includes nextBeforeRevision when more history exists. An unavailable episode or track returns empty items. }
        "400": { description: Invalid title ID, episode number, release track or revision cursor }
  /api/v1/anime/{id}/details:
    get:
      summary: Public catalog enrichment, continuity relations and current episode schedules
      description: Returns explicit source/time provenance when imported. Schedules are predictions; only releasedAt confirms availability. Synopsis and tags may contain spoilers. Relations include canonical linked title, media type and status. PREQUEL/SEQUEL links are navigable from either end with duplicate reciprocal assertions suppressed; other types remain directed. No private tracking data is included.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Consistent public catalog snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogDetails' }
        "400": { description: Invalid UUID }
        "404": { description: Anime not found }
  /api/v1/tracker/{id}/notes:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read private tracker notes
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Plain-text notes and updatedAt save condition; uncached }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing or foreign tracker entry }
    put:
      summary: Conditionally replace private tracker notes
      description: Up to 2000 Unicode code points. Empty notes clear the value. expectedUpdatedAt must match the current tracker timestamp; concurrent tracker changes require a reload. Saved notes remain across rewatches and are included in export/deletion.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [notes, expectedUpdatedAt]
              properties:
                notes: { type: string, maxLength: 2000 }
                expectedUpdatedAt: { type: string, format: date-time }
      responses:
        "200": { description: Saved notes and new updatedAt condition }
        "400": { description: Invalid notes or timestamp }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing or foreign tracker entry }
        "409": { description: Tracker changed; saved notes remain unchanged }
  /api/v1/tracker/{id}/rewatches:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read owned completed viewing passes
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: before
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200": { description: currentCycle and up to 100 snapshots with cycle/count/total/numbers/mode/rating/archivedAt plus nextBefore (zero at end) }
        "400": { description: Invalid history boundary }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Tracker not found for caller }
    post:
      summary: Archive a completed pass and explicitly start a rewatch
      description: Atomically archives current count or exact progress and rating then resets progress to count zero/WATCHING. Series rating and follows remain. Expected cycle prevents a retry from resetting another pass. JSON demo mode is unsupported.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedCycle]
              properties:
                expectedCycle: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200": { description: Updated tracker entry including watchCycle }
        "400": { description: Invalid request }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Tracker not found for caller }
        "409": { description: Expected cycle changed, current pass is incomplete or limit reached }
  /api/v1/tracker/{id}/episodes:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read owned exact or aggregate episode progress
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Progress with animeId, watchCycle, COUNT/EXACT mode, count, nullable numbers and nullable total }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing or foreign tracker entry }
    put:
      summary: Replace owned progress with an exact episode-number set
      description: Explicitly replaces the aggregate count. Empty arrays clear progress. Duplicates and episodes beyond a known total are rejected.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [numbers]
              properties:
                expectedCycle: { type: integer, minimum: 1, maximum: 1000, description: Optional pass guard; stale values return 409. }
                numbers:
                  type: array
                  maxItems: 10000
                  uniqueItems: true
                  items: { type: integer, minimum: 1, maximum: 100000 }
      responses:
        "200": { description: Saved ordered exact progress }
        "409": { description: Viewing pass changed; no progress was overwritten }
        "400": { description: Invalid body or episode selection }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing or foreign tracker entry }
  /api/v1/releases/email-consent:
    get:
      summary: Read the verified account's release email consent
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: enabledSince timestamp or null }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
    put:
      summary: Set the verified account's release email consent
      description: Repeated opt-in preserves the original timestamp. Opting out clears it. This endpoint records consent only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: Updated enabledSince timestamp or null }
        "400": { description: Invalid consent body }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/follows:
    get:
      summary: List owned anime release subscriptions
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          description: Opt into pagination with this page size. Cursor-only requests default to 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: cursor
          description: Continue from nextCursor in the previous response.
          schema: { type: string, maxLength: 256 }
      responses:
        "200": { description: Owned subscriptions with track and creation time. Defaults to up to 1000 subscriptions without pagination parameters. Paged results include nextCursor when more subscriptions exist. }
        "400": { description: Invalid follow cursor or page size }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/follows/{id}:
    get:
      summary: Get the caller's current release subscription for an anime
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Owned subscription with animeId, title, track, scope, scheduleNotices and createdAt }
        "400": { description: Invalid anime identifier }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: No owned subscription for this anime }
    put:
      summary: Follow a season or its linked franchise and choose a release track
      description: Retains the original subscription time on updates and replaces the previous scope for this title. FRANCHISE follows traverse prequel/sequel links and include new-season announcements. Does not replay events before a new subscription.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                track: { type: string, enum: [RAW, SUB, DUB, UNKNOWN, ALL], default: SUB }
                scope: { type: string, enum: [ANIME, FRANCHISE], default: ANIME }
                scheduleNotices: { type: boolean, description: Opt into unconfirmed schedule changes and reviewed title cancellations. Defaults off for new follows. Omit to preserve existing consent. }
      responses:
        "204": { description: Owned subscription saved }
        "409": { description: Account already follows 1000 titles; existing preferences can still change }
        "400": { description: Invalid identifier, track or body }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Unknown anime }
    delete:
      summary: Remove an owned season or franchise subscription
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: scope
          schema: { type: string, enum: [ANIME, FRANCHISE], default: ANIME }
      responses:
        "204": { description: Subscription removed; existing notices retained }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing subscription }
  /api/v1/calendar:
    get:
      summary: Read unconfirmed schedules for the verified owner's follows
      description: Applies direct/franchise season scope and track preferences. Latest revision wins before date filtering; confirmed releases are excluded. Predictions do not establish availability. Results cap at 100 and truncated indicates a narrower window is needed.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: from
          description: UTC start date, inclusive; defaults to today.
          schema: { type: string, format: date }
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 31, default: 14 }
      responses:
        "200": { description: from/to window (end exclusive), items with animeId/title/number/track/scheduledAt/revision and optional provider/verifiedAt, limit and truncated }
        "400": { description: Invalid UTC date/window }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/notifications/summary:
    get:
      summary: Poll counts for owned release notifications
      description: Materializes at most 100 eligible new notices and returns the caller's unread count and the materialization status. The response contains no notice bodies.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Counts for the verified owner
          content:
            application/json:
              schema:
                type: object
                required: [unreadCount, materialization]
                properties:
                  unreadCount: { type: integer, minimum: 0 }
                  materialization:
                    type: object
                    required: [created, hasMore]
                    properties:
                      created: { type: integer, minimum: 0, maximum: 100 }
                      hasMore: { type: boolean }
                      oldestPendingAt: { type: string, format: date-time, description: Occurrence time of the oldest eligible event beyond the current batch }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/notifications:
    get:
      summary: Poll owned in-app release notifications
      description: >-
        Returns confirmed episode and movie releases, eligible linked-season announcements, and approved
        schedule moves, delay reports, cancellations and cancellation corrections for followers who opted into schedule notices.
        Without a cursor, materializes up to 100 eligible notices and returns the latest owner page.
        A cursor reads already-materialized history. Every page rechecks the verified owner.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: cursor
          description: Opaque nextCursor from a previous page; empty selects the latest page.
          schema: { type: string, maxLength: 256 }
        - in: query
          name: unreadOnly
          schema: { type: boolean, default: false }
          description: Filter existing notices before applying the cursor and page limit.
        - in: query
          name: kind
          schema: { type: string, enum: [release, announcement, schedule] }
          description: Filter returned notices by event kind before pagination. Omit for all kinds. The unread total remains account-wide.
      responses:
        "200": { description: Owned items with id/title/body/createdAt/optional readAt, count, account-wide unreadCount, limit=100 and nextCursor (empty at end) }
        "400": { description: Invalid notification cursor or filter }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/notifications/read-all:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Mark all existing in-app release alerts read
      responses:
        "200":
          description: Number of unread notices updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer, minimum: 0 }
        "401": { description: Missing or invalid session }
        "403": { description: Email verification required }
  /api/v1/notifications/{id}/read:
    patch:
      summary: Idempotently mark an owned notification read
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Notice is read }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing or foreign notice }
  /api/v1/preferences:
    get:
      summary: List safe feature taxonomy and the caller's declared weights
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Up to 256 active non-spoiler features with key, name, category and nullable weight }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/preferences/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema: { type: string, maxLength: 128 }
    put:
      summary: Set an owned declared feature preference
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [weight]
              properties:
                weight: { type: number, minimum: -1, maximum: 1 }
      responses:
        "204": { description: Preference saved with declared confidence one }
        "400": { description: Invalid weight, body or unknown fields }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing, inactive or spoiler-sensitive feature }
    delete:
      summary: Reset an owned declared preference without deleting rating-derived signals
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Declared preference reset idempotently }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Missing, inactive or spoiler-sensitive feature }
  /api/v1/recommendations/dismissals:
    get:
      security: [{ bearerAuth: [] }]
      summary: List the caller's hidden Personal Matches
      parameters:
        - in: query
          name: after
          schema: { type: string, format: uuid }
          description: Optional nextCursor from the previous page.
      responses:
        "200": { description: Up to 50 items with animeId and title and an optional nextCursor }
        "400": { description: Invalid cursor }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/recommendations/dismissals/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      security: [{ bearerAuth: [] }]
      summary: Hide a catalog title from Personal Match
      responses:
        "204": { description: Dismissal active }
        "400": { description: Invalid catalog ID }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Catalog title not found }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Restore a catalog title to Personal Match eligibility
      responses:
        "204": { description: Dismissal absent }
        "400": { description: Invalid catalog ID }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/recommendations/essentials:
    get:
      summary: List the reviewed Global Essentials ranking
      responses:
        "200":
          description: Ranked public evidence snapshot
          content:
            application/json:
              schema:
                type: object
                required: [algorithmVersion, items]
                properties:
                  algorithmVersion: { type: string }
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [animeId, title, evidenceKinds, publisherCount, evidence]
                      properties:
                        animeId: { type: string, format: uuid }
                        title: { type: string }
                        evidenceKinds: { type: integer, minimum: 1, maximum: 2 }
                        publisherCount: { type: integer, minimum: 1, maximum: 20 }
                        evidence:
                          type: array
                          minItems: 1
                          maxItems: 20
                          items:
                            type: object
                            required: [kind, publisherId, sourceUrl]
                            properties:
                              kind: { enum: [JURIED_AWARD_WIN, INSTITUTIONAL_SELECTION] }
                              publisherId: { type: string }
                              sourceUrl: { type: string, format: uri }
        "404": { description: Global Essentials is unavailable in this runtime }
  /api/v1/recommendations/discovery/feedback:
    get:
      summary: List the verified owner's saved Discovery reactions
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: after
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Up to 50 reactions with animeId, title, direction and an optional nextCursor }
        "400": { description: Invalid cursor }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/recommendations/discovery/feedback/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Record a verified owner's reaction to an eligible Discovery title
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [direction]
              properties:
                direction: { type: integer, enum: [-1, 1], description: Less like this (-1) or more like this (1). }
      responses:
        "204": { description: Reaction saved }
        "400": { description: Invalid ID or direction }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Title is unavailable for Discovery feedback }
    delete:
      summary: Clear the verified owner's reaction to this title
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Reaction cleared or already absent }
        "400": { description: Invalid ID }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/recommendations/discovery:
    get:
      security: [{ bearerAuth: [] }]
      summary: Discover untracked titles with curated evidence
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: after
          description: Catalog ID from nextCursor. Supply with afterCount.
          schema: { type: string, format: uuid }
        - in: query
          name: afterCount
          description: Evidence count from nextCursor. Supply with after.
          schema: { type: integer, minimum: 1 }
        - in: query
          name: featureKey
          description: Require positive curated evidence for this feature key.
          schema: { type: string, maxLength: 128 }
        - in: query
          name: afterFeature
          description: Feature key from nextCursor when paging a filtered result.
          schema: { type: string, maxLength: 128 }
        - in: query
          name: unfamiliar
          description: Rank by eligible features with no positive evidence on titles in the caller's library.
          schema: { type: boolean, default: false }
        - in: query
          name: afterUnfamiliar
          description: Supply true when nextCursor.unfamiliar is true. In that mode afterCount is the unfamiliar feature count.
          schema: { type: boolean }
      responses:
        "200": { description: Items with animeId, title, positive curated evidenceCount and up to four supportedFeatures names with matching featuredEvidence key/name pairs, unfamiliarCount in unfamiliar mode, feedbackDirection for a saved reaction, plus nextCursor when another page exists }
        "400": { description: Invalid Discovery cursor or feature filter }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/recommendations:
    get:
      summary: Evidence-backed Personal Match ranking for the verified owner
      description: Uses declared preferences and up to 1000 own series ratings against at most 500 untracked candidates prioritized by eligible profile feature overlap. Only referenced curated non-spoiler series observations qualify. Empty evidence produces an empty list. A key-ordered profile of at most 256 active non-spoiler features separates declared and own-rating-derived weight/confidence signals. An inferred signal can include up to three recent contributing ratings belonging to the caller, with canonical title, animeId and score. Raw references and private record identifiers are omitted. Scores are algorithmic compatibility scores, not probabilities.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { description: Items with animeId, title, score, algorithmVersion and up to four feature-key evidence records; response includes candidate/rating caps and bounded declared, inferred and title-feedback profile signals with counts for contributing ratings or reactions }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
  /api/v1/tracker:
    get:
      security: [{ bearerAuth: [] }]
      summary: List library entries
      responses:
        "200": { description: User library }
        "401": { description: Missing or invalid session in PostgreSQL mode }
        "403": { description: email_verification_required in PostgreSQL mode; account controls remain accessible }
    post:
      security: [{ bearerAuth: [] }]
      summary: Add anime to library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [animeId, watchStatus, episodesWatched]
              properties:
                animeId: { type: string, format: uuid }
                watchStatus: { type: string, enum: [PLANNING, WATCHING, COMPLETED, ON_HOLD, DROPPED] }
                episodesWatched: { type: integer, minimum: 0 }
      responses:
        "201": { description: Library entry created }
        "401": { description: Missing or invalid session in PostgreSQL mode }
        "403": { description: email_verification_required in PostgreSQL mode; account controls remain accessible }
  /api/v1/tracker/export:
    get:
      security: [{ bearerAuth: [] }]
      summary: Download the caller's current watch list
      description: Verified PostgreSQL accounts can export current catalog IDs, statuses, episode progress and series ratings as a JSON attachment.
      responses:
        "200":
          description: Versioned watch list attachment
          content:
            application/json:
              schema:
                type: object
                required: [version, entries]
                properties:
                  version: { type: integer, enum: [1] }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [animeId, title, watchStatus, episodesWatched, watchedEpisodeNumbers, rating]
                      properties:
                        animeId: { type: string, format: uuid }
                        title: { type: string }
                        watchStatus: { type: string }
                        episodesWatched: { type: integer }
                        watchedEpisodeNumbers:
                          type: [array, 'null']
                          items: { type: integer }
                        rating: { type: [integer, 'null'] }
        "401": { description: Missing or invalid session }
        "403": { description: Email verification required }
        "500": { description: Export failed }
  /api/v1/tracker/bulk-progress:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Advance watched counts for selected count-mode entries
      description: Atomically advances up to 25 owned entries. Checks current viewing pass and watched count. By default adds one episode. A supplied expectedTotalEpisodes sets the count to that total if the catalog still agrees. Exact selections and entries at a known total are rejected. Watch statuses stay unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, expectedCycle, expectedEpisodesWatched]
                    properties:
                      id: { type: string, format: uuid }
                      expectedCycle: { type: integer, minimum: 1, maximum: 1000 }
                      expectedEpisodesWatched: { type: integer, minimum: 0, maximum: 99999 }
                      expectedTotalEpisodes: { type: integer, minimum: 1, maximum: 100000 }
      responses:
        "200": { description: Updated tracker entries in request order }
        "400": { description: Invalid batch }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Selected entry not found }
        "409": { description: Viewing pass or progress changed, exact mode selected or known total reached }
  /api/v1/tracker/bulk-remove:
    post:
      security: [{ bearerAuth: [] }]
      summary: Remove reviewed owned tracker entries atomically
      description: PostgreSQL mode requires verified email. Send the exact updatedAt timestamp and viewing pass returned for each selected entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, expectedCycle, expectedUpdatedAt]
                    properties:
                      id: { type: string, format: uuid }
                      expectedCycle: { type: integer, minimum: 1, maximum: 1000 }
                      expectedUpdatedAt: { type: string, format: date-time }
      responses:
        "204": { description: All entries removed }
        "400": { description: Invalid batch }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Selected entry not found }
        "409": { description: A selected tracker entry changed }
  /api/v1/tracker/bulk-rating:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Set or clear multiple owned series ratings atomically
      description: PostgreSQL mode requires verified email. Set score to null to clear the current series ratings. Each target must match its current viewing pass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [score, entries]
              properties:
                score:
                  oneOf:
                    - { type: integer, minimum: 1, maximum: 5 }
                    - { type: "null" }
                entries:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, expectedCycle]
                    properties:
                      id: { type: string, format: uuid }
                      expectedCycle: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200": { description: Updated entries in request order }
        "400": { description: Invalid batch }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Selected entry not found }
        "409": { description: Viewing pass changed }
  /api/v1/tracker/bulk-status:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update multiple owned tracker statuses atomically
      description: PostgreSQL mode requires verified email. Each target must match its current viewing pass. The response preserves request order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [watchStatus, entries]
              properties:
                watchStatus: { type: string, enum: [PLANNING, WATCHING, COMPLETED, ON_HOLD, DROPPED] }
                entries:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, expectedCycle]
                    properties:
                      id: { type: string, format: uuid }
                      expectedCycle: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: Updated library entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, animeId, title, watchStatus, episodesWatched, exactProgress, watchCycle, updatedAt]
                      properties:
                        id: { type: string, format: uuid }
                        animeId: { type: string, format: uuid }
                        title: { type: string }
                        watchStatus: { type: string }
                        episodesWatched: { type: integer }
                        exactProgress: { type: boolean }
                        watchCycle: { type: integer }
                        updatedAt: { type: string, format: date-time }
                        totalEpisodes: { type: integer }
                        rating: { type: integer }
        "400": { description: Invalid status or targets }
        "401": { description: Missing or invalid session }
        "403": { description: Email verification required }
        "404": { description: An entry is missing or foreign }
        "409": { description: A viewing pass changed }
        "500": { description: Bulk update failed and rolled back }
  /api/v1/tracker/{id}:
    delete:
      security: [{ bearerAuth: [] }]
      summary: Remove an owned library entry
      description: Atomically deletes this title's tracker entry, all ratings and progress for the caller. Other accounts, shared catalog, follows and recommendation history remain unchanged. Re-adding starts without the deleted rating/progress. JSON mode is local and unauthenticated.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Entry and associated ratings/progress removed; empty response }
        "400": { description: Malformed tracker ID }
        "401": { description: Missing or invalid session in PostgreSQL mode }
        "403": { description: Email verification required in PostgreSQL mode }
        "404": { description: Unknown, foreign or already removed entry }
        "500": { description: Removal failed; transaction rolled back }
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update tracking progress or status
      description: Optional expectedCycle enables a PostgreSQL pass guard; stale edits return 409. Omission keeps legacy unconditional behavior.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedCycle: { type: integer, minimum: 1, maximum: 1000 }
                watchStatus: { type: string, enum: [PLANNING, WATCHING, COMPLETED, ON_HOLD, DROPPED] }
                episodesWatched: { type: integer, minimum: 0 }
      responses:
        "200": { description: Updated entry }
        "409": { description: Viewing pass changed; no update applied }
        "401": { description: Missing or invalid session in PostgreSQL mode }
        "403": { description: email_verification_required in PostgreSQL mode; account controls remain accessible }
  /api/v1/tracker/{id}/season-rating:
    put:
      security: [{ bearerAuth: [] }]
      summary: Set or clear the independent rating for a tracked canonical season or split part
      description: Setting a score in PostgreSQL requires an owned tracker entry with sourced season numbering or an existing canonical season rating. Clearing an absent score is harmless. The rating follows that canonical title across numbering changes.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [score, expectedCycle]
              properties:
                score:
                  oneOf:
                    - { type: integer, minimum: 1, maximum: 5 }
                    - { type: "null" }
                expectedCycle: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200": { description: Updated entry with seasonRating when set and seasonRatingAvailable when eligible }
        "400": { description: Invalid entry id or request }
        "401": { description: Missing or invalid session }
        "403": { description: Verified email required }
        "404": { description: Owned tracker entry not found }
        "409": { description: Viewing pass changed or sourced season number unavailable }
  /api/v1/ratings/{id}:
    put:
      security: [{ bearerAuth: [] }]
      summary: Set rating for a library anime
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "200": { description: Rating saved }
        "401": { description: Missing or invalid session in PostgreSQL mode }
        "403": { description: email_verification_required in PostgreSQL mode; account controls remain accessible }
  /api/v1/auth/register:
    post:
      summary: Register an account (PostgreSQL mode only)
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        "201":
          description: New account and session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        "400": { description: Invalid email, password, or JSON }
        "409": { description: Account unavailable }
        "429": { description: Authentication rate or concurrency limit reached }
  /api/v1/auth/login:
    post:
      summary: Verify credentials (PostgreSQL mode only)
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        "401": { description: Generic invalid credentials response, including disabled or temporarily locked accounts; no lock state is disclosed }
        "429": { description: Authentication rate or concurrency limit reached }
  /api/v1/auth/me:
    get:
      summary: Get the current verified account
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "401": { description: Missing or invalid session }
  /api/v1/auth/refresh:
    post:
      summary: Atomically revoke and replace the current session token
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Replacement session; the old token is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        "401": { description: Missing or invalid session }
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session revoked }
        "401": { description: Missing or invalid session }
  /api/v1/auth/export:
    get:
      summary: Download the current account's product data
      description: Consistent versioned JSON snapshot. Excludes credential/session hashes and security metadata. No-store response with an attachment filename.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account data export
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, exportedAt, user, data]
                properties:
                  schemaVersion: { type: integer, const: 1 }
                  exportedAt: { type: string, format: date-time }
                  user: { $ref: '#/components/schemas/User' }
                  data:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: object }
        "401": { description: Missing or invalid session }
  /api/v1/auth/account:
    delete:
      summary: Permanently delete the current account and its data
      description: Requires the current password. Revokes all account sessions by deleting them. Does not accept a target user ID. This operation cannot be undone.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        "204": { description: Account and owned records deleted }
        "400": { description: Invalid JSON or unknown fields }
        "401": { description: Missing/invalid session, or invalid_current_password for incorrect reauthentication }
        "429": { description: Authentication rate or concurrency limit reached }
  /api/v1/auth/sessions:
    get:
      summary: List the current account's active sessions
      description: Current session first, then newest sessions, bounded to 100. Excludes expired/revoked sessions and all token/digest fields. No-store response.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Owned active sessions
          content:
            application/json:
              schema:
                type: object
                required: [items, count, hasMore]
                properties:
                  count: { type: integer, minimum: 0, maximum: 100 }
                  hasMore: { type: boolean }
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/SessionInfo' }
        "401": { description: Missing or invalid session }
  /api/v1/auth/sessions/{id}:
    delete:
      summary: Revoke an owned active session
      description: A stable ID remains revocable after token refresh. Revoking the current ID signs out the caller.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Session revoked }
        "400": { description: Malformed session ID }
        "401": { description: Missing or invalid caller session }
        "404": { description: Unknown, foreign, expired, or already-revoked session }
  /api/v1/auth/sessions/revoke-others:
    post:
      summary: Sign out all other active sessions
      description: Includes sessions omitted by the bounded listing. Retains the caller session and is idempotent.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, minimum: 0 }
        "401": { description: Missing or invalid session }
  /api/v1/auth/password:
    post:
      summary: Change the current account's password and sign out all existing sessions
      description: Requires current-password verification. New passwords use the registration Argon2id policy. The hash update and revocation commit atomically; the caller must sign in again. Invalid current passwords leave the account and sessions unchanged.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, description: Must contain 12–1024 UTF-8 bytes. }
      responses:
        "204": { description: Password changed and all existing account sessions revoked }
        "400": { description: Invalid JSON, unknown fields, or invalid replacement password }
        "401": { description: Missing/invalid session, or invalid_current_password for incorrect reauthentication }
        "429": { description: Authentication rate or concurrency limit reached }
  /api/v1/auth/password-reset/request:
    post:
      summary: Request an out-of-band password reset
      description: Durable, generic acceptance for known/unknown accounts; an encrypted intent commits before 202, with account lookup deferred. No token is returned. Delivery must be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "202": { description: Encrypted request intent committed for processing within fifteen minutes; account existence and delivery result are not disclosed }
        "400": { description: Invalid JSON or oversized email }
        "429": { description: Request rate/concurrency limit reached }
        "503": { description: Identity delivery is disabled or queue unavailable }
  /api/v1/auth/password-reset/confirm:
    post:
      summary: Consume a reset token and replace the password
      description: Revokes all existing sessions and pending identity challenges. Does not issue a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
                newPassword: { type: string, format: password }
      responses:
        "204": { description: Password reset; sign in again }
        "400": { description: Invalid/expired/replayed/wrong-purpose token, JSON, or replacement password }
        "429": { description: Authentication rate/concurrency limit reached }
  /api/v1/auth/email-verification/request:
    post:
      summary: Request verification of the current account's stored email
      description: Optional body must be empty or an empty JSON object. Recipient overrides are rejected.
      security: [{ bearerAuth: [] }]
      responses:
        "202": { description: Encrypted request intent committed; session is rechecked before issuance and already-verified/cooldown cases send no new mail }
        "400": { description: Unexpected fields or invalid JSON }
        "401": { description: Missing or invalid session }
        "429": { description: Request rate/concurrency limit reached }
        "503": { description: Identity delivery is disabled or queue unavailable }
  /api/v1/auth/email-verification/confirm:
    post:
      summary: Consume an email-verification token
      description: Does not reset passwords or automatically authenticate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "204": { description: Email verified }
        "400": { description: Invalid/expired/replayed/wrong-purpose token or JSON }
        "429": { description: Request rate/concurrency limit reached }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token; PostgreSQL mode only. Never send tokens in URLs.
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
              email: { type: string, format: email, maxLength: 254 }
              password:
                type: string
                format: password
                description: Registration requires 12–1024 UTF-8 bytes. Request body limit is 4096 bytes.
  schemas:
    CatalogDetails:
      type: object
      required: [anime, externalIds, synonyms, genres, themes, demographics, tags, studios, relations, episodes]
      properties:
        anime: { $ref: '#/components/schemas/Anime' }
        externalIds:
          type: array
          description: Exact public title identities, not metadata authority or raw review evidence.
          items:
            type: object
            required: [provider, externalId]
            properties:
              provider: { type: string }
              externalId: { type: string }
        provider: { type: string }
        observedAt: { type: string, format: date-time }
        seasonNumber: { type: integer, format: int32, minimum: 1, description: Sourced franchise season number. Omitted when absent. }
        partNumber: { type: integer, format: int32, minimum: 1, description: Sourced split-season part number. Returned only with seasonNumber. }
        synonyms: { type: array, items: { type: string } }
        genres: { type: array, items: { type: string } }
        themes: { type: array, items: { type: string }, description: Sourced themes; may contain spoilers. }
        demographics: { type: array, items: { type: string }, description: Provider title category labels; never inferred user attributes. }
        tags: { type: array, items: { type: string } }
        studios: { type: array, items: { type: string } }
        relations:
          type: array
          items:
            type: object
            required: [animeId, type, title, mediaType, status]
            properties:
              animeId: { type: string, format: uuid }
              type: { type: string }
              title: { type: string }
              mediaType: { type: string }
              status: { type: string }
        episodes:
          type: array
          items:
            type: object
            required: [number, track, revision]
            properties:
              number: { type: integer }
              track: { type: string, enum: [RAW, SUB, DUB, UNKNOWN] }
              revision: { type: integer }
              scheduledAt: { type: string, format: date-time }
              releasedAt: { type: string, format: date-time }
              verifiedAt: { type: string, format: date-time }
    Anime:
      type: object
      required: [id, title, mediaType, status, episodeCountKnown]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        nativeTitle: { type: string }
        mediaType: { type: string }
        status: { type: string }
        releaseYear: { type: integer }
        synopsis: { type: string, description: Optional source text; may contain spoilers. }
        season: { type: string, description: Optional airing quarter rather than franchise season number. }
        coverImageUrl: { type: string }
        episodeCountKnown: { type: boolean, description: False means the episode total is unknown. }
        episodeCount: { type: integer, description: Omitted when zero; use episodeCountKnown to distinguish known zero from unknown. }
    SessionInfo:
      type: object
      additionalProperties: false
      required: [id, createdAt, expiresAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }
    User:
      type: object
      required: [id, email, displayName, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        emailVerified: { type: boolean }
    Session:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string, minLength: 43, maxLength: 43, description: Returned only at issuance; store in volatile client memory. }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
