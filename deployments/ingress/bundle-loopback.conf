# Isolated release-bundle rehearsal. All upstreams share the local namespace.
worker_processes 1;
pid /tmp/anime-bundle-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/anime-client-body;
    proxy_temp_path /tmp/anime-proxy;
    fastcgi_temp_path /tmp/anime-fastcgi;
    uwsgi_temp_path /tmp/anime-uwsgi;
    scgi_temp_path /tmp/anime-scgi;

    server {
        listen 127.0.0.1:8090;
        server_name localhost;
        client_max_body_size 16m;
        client_header_timeout 10s;
        client_body_timeout 15s;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";

        location ~ ^/api/v1(?:/|$) {
            proxy_pass http://127.0.0.1:8080;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
