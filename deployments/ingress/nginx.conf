# Standalone loopback example. No public listener is configured.
worker_processes 1;
pid /tmp/anime-ingress.pid;
error_log /dev/null crit;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    # Use the TCP peer. Ignore source addresses supplied in HTTP headers.
    map "$request_method:$uri" $credential_client {
        default "";
        ~^POST:/api/v1/auth/(register|login|password|password-reset/(request|confirm)|email-verification/(request|confirm))$ $binary_remote_addr;
        ~^DELETE:/api/v1/auth/account$ $binary_remote_addr;
    }

    map "$request_method:$uri" $analysis_client {
        default "";
        "POST:/api/v1/analysis/catalog/assisted" $binary_remote_addr;
    }

    map $http_origin $loopback_cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
        "http://127.0.0.1:3000" $http_origin;
    }

    limit_req_zone $credential_client zone=identity_requests:1m rate=12r/m;
    limit_req_zone $analysis_client zone=analysis_requests:1m rate=12r/m;
    limit_conn_zone $binary_remote_addr zone=peer_connections:1m;

    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        client_max_body_size 16m;
        client_header_timeout 10s;
        client_body_timeout 15s;

        limit_req_status 429;
        limit_conn_status 429;
        error_page 429 = @bounded_request;

        location / {
            limit_conn peer_connections 16;
            limit_req zone=identity_requests burst=5 nodelay;
            limit_req zone=analysis_requests burst=3 nodelay;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_send_timeout 15s;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_pass http://127.0.0.1:8080;
        }

        location @bounded_request {
            internal;
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Access-Control-Allow-Origin $loopback_cors_origin always;
            add_header Access-Control-Expose-Headers Retry-After always;
            add_header Vary Origin always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            return 429 '{"error":"too_many_requests"}';
        }
    }
}
