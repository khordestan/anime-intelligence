services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATA_FILE: /app/data/local.json
    volumes:
      - anime_data:/app/data
    restart: unless-stopped
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - api
    restart: unless-stopped
volumes:
  anime_data:
