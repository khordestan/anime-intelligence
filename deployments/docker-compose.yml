services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATA_FILE: /app/data/local.json
    volumes:
      - anime_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  anime_data:
